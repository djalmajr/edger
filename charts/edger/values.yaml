# Topologia temporariamente single-replica. Os workers instalados ficam no PVC,
# mas o índice de roteamento é mantido em memória por processo; até existir
# distribuição/coordenação de workers, o chart rejeita replicaCount diferente
# de 1 e HPA habilitado para evitar respostas não determinísticas.

replicaCount: 1

image:
  repository: ghcr.io/djalmajr/edger
  tag: ""
  # Opcional e imutável. Quando preenchido tem precedência sobre tag. No chart
  # publicado no ghcr o CI grava aqui o sha256 da imagem do mesmo release; no
  # repositório fica vazio (a imagem sai da tag = appVersion).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  host: ""
  className: ""
  path: "/"
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Persistência das api-keys do control plane (egk_). Vazio = derivado de
# runtime.workerDirs (<workerDirs>/.edger/api-keys.db) — o PVC RWO existente;
# o diretório .edger é invisível ao scan de workers. Só inicializa quando a
# auth está configurada (root key ou OIDC).
apiKeys:
  dbPath: ""

# Cofre de segredos de app (EDG-38): workers declaran `secrets:` no manifest
# e o EdgeR injeta os valores no env do processo do worker (o valor nunca
# aparece em manifest, publicEnv, logs ou eventos). Opt-in, desligado por
# padrão: com enabled=false nenhum campo é lido e o binário segue sem cofre
# (as rotas /api/admin/workers/{name}/secrets respondem 503 e a injeção não
# acontece). Com enabled=true o chart exige um Secret EXISTENTE com a chave
# mestra (32 bytes, base64 ou raw) — montado read-only em caminho fixo
# (EDGER_SECRETS_KEY_FILE). A chave nunca entra no ConfigMap, nos values da
# release ou nos logs. dbPath: vazio = derivado de runtime.workerDirs
# (<workerDirs>/.edger/app-secrets.db), ao lado da api-keys.db no mesmo PVC
# RWO.
appSecrets:
  enabled: false
  dbPath: ""
  keySecret:
    # Nome do Secret existente no namespace; o chart nunca o cria nem
    # armazena a chave mestra.
    name: ""
    # Chave do Secret que contém a chave mestra (32 bytes, base64 ou raw).
    key: "master-key"

# Guarda de saída (EDG-38): workers com `egress.enabled` no manifest alcançam
# hosts HTTPS escolhidos pelo usuário só pelo guarda do EdgeR, que recusa IPs
# internos. O IP do nó vem sozinho do downward API (EDGER_NODE_IP) e também é
# recusado. blockCidrs (opcional) lista CIDRs extras a recusar; vazio mantém o
# padrão do binário (as faixas de pod e serviço do k3s, 10.42.0.0/16 e
# 10.43.0.0/16). Vira EDGER_EGRESS_BLOCK_CIDRS (separados por vírgula).
# EDGER_EGRESS_ALLOW_CIDRS é só de desenvolvimento local e não é exposto aqui.
egress:
  blockCidrs: []

runtime:
  workerDirs: "/app/workers"
  jsRuntime: "process"
  coreWorkerDir: "/opt/edger/core-workers"
  coreWorkerOverlayDir: "/app/core-worker-overlays"
  # Com a persistência de workers ligada, o overlay usa o mesmo PVC em
  # subPath: .edger/core-overlays; o diretório .edger é invisível ao scan de
  # workers.
  persistCoreWorkerOverlay: true

# Deve permanecer habilitado em ambientes que recebem workers pela Admin API:
# o conteúdo sobrevive ao restart enquanto o índice é reconstruído em memória.
# Com persistência, o Deployment usa Recreate para o PVC RWO nunca ser montado
# simultaneamente pelo pod antigo e pelo novo.
userWorkers:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

cron:
  enabled: true

# Data plane compression (brotli + gzip): app responses are compressed
# based on Accept-Encoding; 406 is returned ONLY for apps when none of
# br/gzip/identity is accepted (the control plane is never compressed and
# never 406s). minBytes is the minimum body size when the size is known;
# streaming bodies are always candidates. level: default | fastest | best |
# integer — best is brotli quality 11, the most expensive setting for
# dynamic/streaming bodies.
compression:
  enabled: true
  minBytes: 1024
  level: default

otel:
  enabled: false
  endpoint: ""
  protocol: grpc
  tracesSampler: parentbased_traceidratio
  tracesSamplerArg: "0.1"
  required: false
  headersSecret:
    name: ""
    key: headers

rootKey:
  value: ""
  existingSecret: ""
  secretKey: root-key
  mountPath: /var/run/secrets/edger-root
  fileName: root-key

# Optional initial root password for cPanel user/password login. The Secret
# must already exist; the chart only mounts its key read-only. The password is
# consumed to seed root when the console user store is empty, never used as a
# release value or written to the ConfigMap.
consoleAuth:
  rootPasswordSecret:
    name: ""
    key: password

oidc:
  enabled: false
  issuer: ""
  audience: ""
  rolesClaim: ""
  requiredRole: ""

# Roteamento opcional por tenant (allowlist) e split A/B de versões.
# Opt-ins independentes, desligados por padrão: cada flag só habilita a sua
# própria parte da política. Com tenantRouting.enabled=true o chart exige a
# URL HTTPS exata do endpoint /v1/identify do Tenancit e um Secret existente
# com o token do API client tenant:identify — montado read-only em caminho
# fixo (EDGER_TENANCIT_TOKEN_FILE). O token nunca entra no ConfigMap, nos
# values da release ou nos logs. Com a flag off, nenhum campo Tenancit é
# lido nem exige configuração.
tenantRouting:
  enabled: false
  tenancit:
    # URL exata do endpoint Consumer API no cluster real, ex.:
    # https://tenancit.<host>.<cluster>/v1/identify
    identifyUrl: ""
    tokenSecret:
      # Nome do Secret existente no namespace; o chart nunca o cria nem
      # armazena o token.
      name: ""
      # Chave do Secret que contém o token do API client tenant:identify.
      key: ""

# Split A/B: com a flag ligada, requests sem versão explícita seguem os
# pesos das versões na política de roteamento do app (quando publicada);
# sem política vale o roteamento atual.
weightedRouting:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

extraEnv: []
extraEnvFrom: []

# Bloqueado pela validação do chart enquanto a distribuição de workers não
# coordenar o PVC e o índice em memória entre réplicas.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
