# Topologia temporariamente single-replica. Os workers instalados ficam no PVC,
# mas o índice de roteamento é mantido em memória por processo; até existir
# distribuição/coordenação de workers, o chart rejeita replicaCount diferente
# de 1 e HPA habilitado para evitar respostas não determinísticas.

replicaCount: 1

image:
  repository: ghcr.io/djalmajr/edger
  tag: ""
  # Opcional e imutável. Quando preenchido tem precedência sobre tag; o CI
  # publica a imagem, captura o sha256 e o injeta com --set-string.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  host: ""
  className: ""
  path: "/"
  pathType: Prefix
  annotations: {}
  tls:
    enabled: false
    secretName: ""

runtime:
  workerDirs: "/app/workers"
  jsRuntime: "process"
  coreWorkerDir: "/opt/edger/core-workers"
  coreWorkerOverlayDir: "/app/core-worker-overlays"

# Deve permanecer habilitado em ambientes que recebem workers pela Admin API:
# o conteúdo sobrevive ao restart enquanto o índice é reconstruído em memória.
# Com persistência, o Deployment usa Recreate para o PVC RWO nunca ser montado
# simultaneamente pelo pod antigo e pelo novo.
userWorkers:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

cron:
  enabled: true

otel:
  enabled: false
  endpoint: ""
  protocol: grpc
  tracesSampler: parentbased_traceidratio
  tracesSamplerArg: "0.1"
  required: false
  headersSecret:
    name: ""
    key: headers

rootKey:
  value: ""
  existingSecret: ""
  secretKey: root-key
  mountPath: /var/run/secrets/edger-root
  fileName: root-key

oidc:
  enabled: false
  issuer: ""
  audience: ""
  rolesClaim: ""
  requiredRole: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

extraEnv: []
extraEnvFrom: []

# Bloqueado pela validação do chart enquanto a distribuição de workers não
# coordenar o PVC e o índice em memória entre réplicas.
hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
