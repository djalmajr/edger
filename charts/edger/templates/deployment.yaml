{{- include "edger.validate" . -}}
{{- $hasRootKey := or .Values.rootKey.value .Values.rootKey.existingSecret }}
{{- $tenantEnabled := .Values.tenantRouting.enabled }}
{{- $appSecretsEnabled := .Values.appSecrets.enabled }}
{{- $extraEnv := .Values.extraEnv }}
{{- if kindIs "string" $extraEnv }}
{{- $parsed := fromYamlArray $extraEnv }}
{{- if and (kindIs "slice" $parsed) (eq (len $parsed) 1) (kindIs "string" (index $parsed 0)) }}
{{- fail "extraEnv must be a YAML list" }}
{{- end }}
{{- $extraEnv = $parsed }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edger.fullname" . }}
  labels:
    {{- include "edger.labels" . | nindent 4 }}
spec:
  {{- if or .Values.userWorkers.persistence.enabled .Values.managedDatabase.enabled }}
  # A single-writer RWO PVC cannot be attached safely to old and new pods
  # during a rolling update, and each pod owns an independent in-memory index.
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "edger.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.managedDatabase.enabled }}
      initContainers:
        - name: managed-database-directories
          image: {{ include "edger.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - "umask 077; mkdir -p /var/lib/edger-managed/registry /var/lib/edger-managed/backups; find /var/lib/edger-managed/registry /var/lib/edger-managed/backups -maxdepth 0 -type d -exec chmod u=rwx,go=,u-s,g-s,o-t {} +; find /var/lib/edger-managed/registry /var/lib/edger-managed/backups -xdev -type f ! -perm 0600 -exec chmod 0600 {} +"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: managed-database
              mountPath: /var/lib/edger-managed
      {{- end }}
      containers:
        - name: edger
          image: {{ include "edger.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "edger.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # (EDG-38) IP do nó (downward API): o guarda de saída o recusa
            # como destino, junto das faixas de pod/serviço.
            - name: EDGER_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- with .Values.egress.blockCidrs }}
            # (EDG-38) faixas extras recusadas pelo guarda de saída (CIDRs
            # separados por vírgula). Vazio mantém o padrão do binário.
            # EDGER_EGRESS_ALLOW_CIDRS é só de desenvolvimento e NÃO existe
            # no chart.
            - name: EDGER_EGRESS_BLOCK_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $hasRootKey }}
            - name: EDGER_ROOT_KEY_FILE
              value: {{ include "edger.rootKeyFilePath" . | quote }}
            {{- end }}
            {{- if .Values.consoleAuth.rootPasswordSecret.name }}
            - name: EDGER_ROOT_PASSWORD_FILE
              value: {{ include "edger.rootPasswordFilePath" . | quote }}
            {{- end }}
            {{- if and .Values.otel.enabled .Values.otel.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.headersSecret.name | quote }}
                  key: {{ .Values.otel.headersSecret.key | quote }}
            {{- end }}
            {{- if $tenantEnabled }}
            # O token vive no Secret montado em caminho fixo; apenas o path
            # entra no pod. Nada de token em env em texto puro.
            - name: EDGER_TENANCIT_TOKEN_FILE
              value: {{ include "edger.tenancitTokenFilePath" . | quote }}
            {{- end }}
            {{- if $appSecretsEnabled }}
            # A chave mestra do cofre vive no Secret montado em caminho
            # fixo; apenas o path entra no pod. Nada de chave em env em
            # texto puro.
            - name: EDGER_SECRETS_KEY_FILE
              value: {{ include "edger.appSecretsKeyFilePath" . | quote }}
            {{- end }}
            {{- range $name, $value := dict "EDGER_SSE_MAX_CONNECTIONS" .Values.sse.maxConnections "EDGER_SSE_MAX_CONNECTIONS_PER_APP" .Values.sse.maxConnectionsPerApp "EDGER_SSE_HEARTBEAT_MS" .Values.sse.heartbeatMs "EDGER_HTTP_DRAIN_MS" .Values.httpDrainMs }}
            {{- if ne (toString $value) "" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.managedDatabase.enabled }}
            - name: EDGER_SQLD_ADMIN_URL
              value: {{ .Values.managedDatabase.adminUrl | quote }}
            - name: EDGER_SQLD_USER_URL
              value: {{ .Values.managedDatabase.userUrl | quote }}
            - name: EDGER_SQLD_ADMIN_KEY_FILE
              value: /var/run/secrets/edger-sqld-admin/key
            - name: EDGER_SQLD_SIGNER_KEY_FILE
              value: /var/run/secrets/edger-sqld-signer/key
            - name: EDGER_SQLD_REGISTRY_DB
              value: /var/lib/edger-managed/registry/registry.db
            - name: EDGER_SQLD_BACKUP_DIR
              value: /var/lib/edger-managed/backups
            - name: EDGER_SQLD_MANAGED_BUDGET_BYTES
              value: {{ .Values.managedDatabase.budgetBytes | quote }}
            {{- end }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: user-workers
              mountPath: {{ .Values.runtime.workerDirs | quote }}
            {{- if and .Values.runtime.persistCoreWorkerOverlay .Values.userWorkers.persistence.enabled }}
            - name: user-workers
              mountPath: {{ .Values.runtime.coreWorkerOverlayDir | quote }}
              subPath: .edger/core-overlays
            {{- else }}
            - name: core-worker-overlay
              mountPath: {{ .Values.runtime.coreWorkerOverlayDir | quote }}
            {{- end }}
            {{- if $hasRootKey }}
            - name: root-key
              mountPath: {{ .Values.rootKey.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.consoleAuth.rootPasswordSecret.name }}
            - name: console-root-password
              mountPath: /var/run/secrets/edger-console-root
              readOnly: true
            {{- end }}
            {{- if $tenantEnabled }}
            - name: tenancit-token
              mountPath: {{ include "edger.tenancitTokenMountPath" . }}
              readOnly: true
            {{- end }}
            {{- if $appSecretsEnabled }}
            - name: app-secrets-key
              mountPath: {{ include "edger.appSecretsKeyMountPath" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.managedDatabase.enabled }}
            - name: managed-database
              mountPath: /var/lib/edger-managed
            - name: managed-admin-key
              mountPath: /var/run/secrets/edger-sqld-admin
              readOnly: true
            - name: managed-signer-key
              mountPath: /var/run/secrets/edger-sqld-signer
              readOnly: true
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: user-workers
          {{- if .Values.userWorkers.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-user-workers" (include "edger.fullname" .)) .Values.userWorkers.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if not (and .Values.runtime.persistCoreWorkerOverlay .Values.userWorkers.persistence.enabled) }}
        - name: core-worker-overlay
          emptyDir: {}
        {{- end }}
        {{- if $hasRootKey }}
        - name: root-key
          secret:
            secretName: {{ include "edger.rootKeySecretName" . }}
            items:
              - key: {{ .Values.rootKey.secretKey | quote }}
                path: {{ .Values.rootKey.fileName | quote }}
        {{- end }}
        {{- if .Values.consoleAuth.rootPasswordSecret.name }}
        - name: console-root-password
          secret:
            secretName: {{ .Values.consoleAuth.rootPasswordSecret.name | quote }}
            items:
              - key: {{ .Values.consoleAuth.rootPasswordSecret.key | quote }}
                path: password
        {{- end }}
        {{- if $tenantEnabled }}
        # Secret existente (o chart não o cria); a chave configurada é
        # projetada como o arquivo fixo lido por EDGER_TENANCIT_TOKEN_FILE.
        - name: tenancit-token
          secret:
            secretName: {{ .Values.tenantRouting.tenancit.tokenSecret.name | quote }}
            items:
              - key: {{ .Values.tenantRouting.tenancit.tokenSecret.key | quote }}
                path: token
        {{- end }}
        {{- if $appSecretsEnabled }}
        # Secret existente (o chart não o cria); a chave mestra (32 bytes,
        # base64 ou raw) é projetada como o arquivo fixo lido por
        # EDGER_SECRETS_KEY_FILE.
        - name: app-secrets-key
          secret:
            secretName: {{ .Values.appSecrets.keySecret.name | quote }}
            defaultMode: 0400 # (F6) chave mestra: somente leitura para o dono do processo
            items:
              - key: {{ .Values.appSecrets.keySecret.key | quote }}
                path: {{ .Values.appSecrets.keySecret.key | quote }}
        {{- end }}

        {{- if .Values.managedDatabase.enabled }}
        - name: managed-database
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-managed-database" (include "edger.fullname" .)) .Values.managedDatabase.persistence.existingClaim }}
        {{- range $kind, $secret := dict "admin" .Values.managedDatabase.adminKeySecret "signer" .Values.managedDatabase.signerKeySecret }}
        - name: managed-{{ $kind }}-key
          secret:
            secretName: {{ $secret.name | quote }}
            defaultMode: 0440
            items:
              - key: {{ $secret.key | quote }}
                path: key
        {{- end }}
        {{- end }}
