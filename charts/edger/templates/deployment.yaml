{{- include "edger.validate" . -}}
{{- $hasRootKey := or .Values.rootKey.value .Values.rootKey.existingSecret }}
{{- $tenantEnabled := .Values.tenantRouting.enabled }}
{{- $extraEnv := .Values.extraEnv }}
{{- if kindIs "string" $extraEnv }}
{{- $parsed := fromYamlArray $extraEnv }}
{{- if and (kindIs "slice" $parsed) (eq (len $parsed) 1) (kindIs "string" (index $parsed 0)) }}
{{- fail "extraEnv must be a YAML list" }}
{{- end }}
{{- $extraEnv = $parsed }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edger.fullname" . }}
  labels:
    {{- include "edger.labels" . | nindent 4 }}
spec:
  {{- if .Values.userWorkers.persistence.enabled }}
  # A single-writer RWO PVC cannot be attached safely to old and new pods
  # during a rolling update, and each pod owns an independent in-memory index.
  strategy:
    type: Recreate
  {{- end }}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edger.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "edger.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: edger
          image: {{ include "edger.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "edger.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $hasRootKey .Values.consoleAuth.rootPasswordSecret.name $extraEnv $tenantEnabled (and .Values.otel.enabled .Values.otel.headersSecret.name) }}
          env:
            {{- if $hasRootKey }}
            - name: EDGER_ROOT_KEY_FILE
              value: {{ include "edger.rootKeyFilePath" . | quote }}
            {{- end }}
            {{- if .Values.consoleAuth.rootPasswordSecret.name }}
            - name: EDGER_ROOT_PASSWORD_FILE
              value: {{ include "edger.rootPasswordFilePath" . | quote }}
            {{- end }}
            {{- if and .Values.otel.enabled .Values.otel.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.otel.headersSecret.name | quote }}
                  key: {{ .Values.otel.headersSecret.key | quote }}
            {{- end }}
            {{- if $tenantEnabled }}
            # O token vive no Secret montado em caminho fixo; apenas o path
            # entra no pod. Nada de token em env em texto puro.
            - name: EDGER_TENANCIT_TOKEN_FILE
              value: {{ include "edger.tenancitTokenFilePath" . | quote }}
            {{- end }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: user-workers
              mountPath: {{ .Values.runtime.workerDirs | quote }}
            {{- if and .Values.runtime.persistCoreWorkerOverlay .Values.userWorkers.persistence.enabled }}
            - name: user-workers
              mountPath: {{ .Values.runtime.coreWorkerOverlayDir | quote }}
              subPath: .edger/core-overlays
            {{- else }}
            - name: core-worker-overlay
              mountPath: {{ .Values.runtime.coreWorkerOverlayDir | quote }}
            {{- end }}
            {{- if $hasRootKey }}
            - name: root-key
              mountPath: {{ .Values.rootKey.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.consoleAuth.rootPasswordSecret.name }}
            - name: console-root-password
              mountPath: /var/run/secrets/edger-console-root
              readOnly: true
            {{- end }}
            {{- if $tenantEnabled }}
            - name: tenancit-token
              mountPath: {{ include "edger.tenancitTokenMountPath" . }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: user-workers
          {{- if .Values.userWorkers.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-user-workers" (include "edger.fullname" .)) .Values.userWorkers.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if not (and .Values.runtime.persistCoreWorkerOverlay .Values.userWorkers.persistence.enabled) }}
        - name: core-worker-overlay
          emptyDir: {}
        {{- end }}
        {{- if $hasRootKey }}
        - name: root-key
          secret:
            secretName: {{ include "edger.rootKeySecretName" . }}
            items:
              - key: {{ .Values.rootKey.secretKey | quote }}
                path: {{ .Values.rootKey.fileName | quote }}
        {{- end }}
        {{- if .Values.consoleAuth.rootPasswordSecret.name }}
        - name: console-root-password
          secret:
            secretName: {{ .Values.consoleAuth.rootPasswordSecret.name | quote }}
            items:
              - key: {{ .Values.consoleAuth.rootPasswordSecret.key | quote }}
                path: password
        {{- end }}
        {{- if $tenantEnabled }}
        # Secret existente (o chart não o cria); a chave configurada é
        # projetada como o arquivo fixo lido por EDGER_TENANCIT_TOKEN_FILE.
        - name: tenancit-token
          secret:
            secretName: {{ .Values.tenantRouting.tenancit.tokenSecret.name | quote }}
            items:
              - key: {{ .Values.tenantRouting.tenancit.tokenSecret.key | quote }}
                path: token
        {{- end }}
