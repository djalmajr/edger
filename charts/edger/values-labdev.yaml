# Overlay do labdev. A topologia é intencionalmente single-replica: a Admin API
# persiste os workers no PVC, mas cada processo mantém seu próprio índice de
# roteamento em memória. O chart rejeita réplicas adicionais e HPA até existir
# distribuição/coordenação de workers.
#
# Drafts do Studio usam `visibility: internal`: nunca são invocados por rota
# pública. O teste passa pelo control plane autenticado
# (`/api/admin/workers/.../invoke`) — que o Studio alcança pelo SERVICE
# interno do cluster. O Ingress expõe somente os workers públicos (/p-*);
# a Admin API não tem rota pública nenhuma.
#
# Segredos ficam fora do chart. Pré-provisione no namespace `hyper`:
#   - Secret `edger-root-key`, chave `root-key`;
#   - Secret dockerconfigjson `harbor-cithyper` para o Harbor.
#
# O CI publica a imagem, captura o digest imutável e o injeta no deploy:
#
#   helm upgrade --install edger charts/edger \
#     --namespace hyper \
#     -f charts/edger/values-labdev.yaml \
#     --set-string image.digest=sha256:...

replicaCount: 1

image:
  repository: repositorio.cithyper.click/centralit/edger
  # Sempre preenchido pelo CI via --set-string; vazio permite somente render e
  # instalações locais usando a tag/appVersion do chart.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-cithyper

ingress:
  enabled: true
  className: nginx
  # Sem DNS próprio no labdev (só itsm-labdev/admin-labdev existem): os
  # workers são servidos no host WILDCARD, como o edge-runtime legado (/a,
  # /s) e o próprio Studio (/lwc-studio). Um host exato aqui criaria um
  # server block nginx que passa a vencer o wildcard e derruba os paths dos
  # outros ingresses nesse host — não use admin-labdev literal.
  host: "*.cloud4biz.com"
  # Todos os workers do Studio nascem com prefixo `p-` (p-<id> e p-<id>-api,
  # com e sem @versão): uma location de PREFIXO DE STRING do nginx
  # (ImplementationSpecific) cobre a família inteira, sem rewrite — o
  # base_href que o Edger emite (`/{worker}/`) continua valendo tal qual.
  # A Admin API fica FORA do ingress de propósito: o Studio fala com ela
  # pelo service interno, e superfície de controle não precisa de rota
  # pública.
  path: /p-
  pathType: ImplementationSpecific
  tls:
    enabled: false

rootKey:
  # Nunca coloque a root key neste arquivo. O Secret é provisionado pelo cofre
  # do ambiente e apenas montado pelo chart.
  existingSecret: edger-root-key
  secretKey: root-key

userWorkers:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

hpa:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
