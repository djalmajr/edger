# Overlay do labdev. A topologia é intencionalmente single-replica: a Admin API
# persiste os workers no PVC, mas cada processo mantém seu próprio índice de
# roteamento em memória. O chart rejeita réplicas adicionais e HPA até existir
# distribuição/coordenação de workers.
#
# Drafts do Studio usam `visibility: internal`: nunca são invocados por rota
# pública. O teste passa pelo control plane autenticado
# (`/api/admin/workers/.../invoke`) — que o Studio alcança pelo SERVICE
# interno do cluster. O Ingress expõe somente os workers públicos (/p-*);
# a Admin API não tem rota pública nenhuma.
#
# Segredos ficam fora do chart. Pré-provisione no namespace `hyper` o
# Secret `edger-root-key`, chave `root-key`. A imagem vem do ghcr público —
# nenhum pull secret.
#
# O CI do GitHub publica a imagem em tag SemVer; instale com o digest:
#
#   helm upgrade --install edger charts/edger \
#     --namespace hyper \
#     -f charts/edger/values-labdev.yaml \
#     --set-string image.digest=sha256:...

replicaCount: 1

image:
  # Publicada pelo workflow do GitHub em tag SemVer, como o tenancit — o
  # labdev puxa o ghcr público direto, sem pull secret. Instale sempre por
  # digest (--set-string image.digest=sha256:…), nunca por tag móvel.
  repository: ghcr.io/djalmajr/edger
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

ingress:
  enabled: true
  # Kong, não nginx: o rke2-ingress-nginx normaliza QUALQUER pathType para a
  # semântica de segmento (`location "/p-/"` + `location = "/p-"`), então um
  # prefixo de STRING como /p- nunca casa /p-<id> lá. Já o Kong — que recebe
  # tudo que não casa nenhuma location, pelo catch-all `/` do
  # frontmanager — faz prefix de string nativo: com ImplementationSpecific o
  # KIC passa o path cru para a rota. Mesmo padrão do hyper/agility.
  className: kong
  # Sem DNS próprio no labdev (só itsm-labdev/admin-labdev existem): os
  # workers são servidos no host WILDCARD, como os demais paths da
  # plataforma. Um host exato criaria um server block nginx que passa a
  # vencer o wildcard e derruba os paths dos outros ingresses nesse host.
  host: "*.cloud4biz.com"
  # TODO worker público vive sob /apps/: o Kong faz o strip
  # (/apps/meu-crm → /meu-crm chega ao Edger, qualquer que seja o nome —
  # basename escolhido no Studio ou legado p-<id>) e envia
  # X-Forwarded-Prefix, que o Edger ≥0.2.1 honra ao compor o base_href.
  # A Admin API fica FORA do ingress de propósito: o Studio fala com ela
  # pelo service interno, e superfície de controle não precisa de rota
  # pública.
  path: /apps/
  pathType: ImplementationSpecific
  annotations:
    konghq.com/preserve-host: "true"
    konghq.com/protocols: https
    konghq.com/strip-path: "true"
  tls:
    enabled: false

rootKey:
  # Nunca coloque a root key neste arquivo. O Secret é provisionado pelo cofre
  # do ambiente e apenas montado pelo chart.
  existingSecret: edger-root-key
  secretKey: root-key

userWorkers:
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

hpa:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
