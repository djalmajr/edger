# rc.19 abaixo é o mínimo histórico para EDG-24, não para banco gerenciado.
# Para managedDatabase, use 0.3.2-rc.31 ou posterior (contém EDG-88)
# e use a mesma versão validada no ensaio e no corte.
# Release `edger` da plataforma (namespace `edger`), a partir do chart
# `charts/edger`. Comandos (o chart publicado fixa a imagem por digest
# `image.digest`; não defina `image.tag` nem `image.digest` aqui — um
# digest vazio sobrescreveria o do chart e cairia numa tag mutável):
#
#   helm upgrade --install edger oci://ghcr.io/djalmajr/charts/edger \
#     --version 0.3.2-rc.31 -n edger -f deploy/production/values.edger.yaml \
#     --history-max 5
#
# Em produção desde 2026-11-08: 0.3.2-rc.31, Helm revisão 14.
#
# O `--version` deve ser `0.3.2-rc.19` ou mais nova (a primeira com a
# EDG-24, o `release` de worker só de root). Nada de segredo neste
# arquivo: a root key sai do Secret existente `edger-root` (chave
# `root-key`), criado fora do git (ver README.md).
fullnameOverride: edger

# A rota pública do control plane é o IngressRoute do Traefik em
# control-plane.yaml (adendo EDG-27); o Ingress nativo do chart fica
# desligado.
ingress:
  enabled: false

rootKey:
  existingSecret: edger-root
  secretKey: root-key

# Senha inicial do root do console (EDG-44): o Secret existente
# `edger-console-root-password` (chave `password`), criado fora do git, só
# semeia o root quando o banco de usuários do console está vazio.
consoleAuth:
  rootPasswordSecret:
    name: edger-console-root-password
    key: password

# Cofre de segredos de app (EDG-38, 0.3.2-rc.24 ou mais nova): a chave
# mestra vem do Secret existente `edger-app-secrets` (chave `master-key`),
# criado fora do git (ver README.md); o banco cifrado fica no PVC de
# workers, em `/app/workers/.edger/app-secrets.db`.
appSecrets:
  enabled: true
  keySecret:
    name: edger-app-secrets
    key: master-key

# Banco gerenciado (EDG-54, 0.3.2-rc.31 ou mais nova), ligado em
# 2026-11-08. Os dois Secrets e o PVC existem fora do Helm: `sqld-admin`
# (chave `admin-auth-key`, a mesma do sqld), `edger-sqld-signer` (chave
# `key`, 32 bytes em base64, diferente da master do cofre; cópia em
# `secret/infra/edger/production/edger-sqld-signer` no OpenBao) e o PVC
# `edger-managed-database` (managed-database-pvc.yaml), externo para que um
# rollback do Helm nunca apague o ledger. budgetBytes é imutável depois do
# primeiro boot. `userUrl` é o Service `sqld-data` e `adminUrl` o
# `sqld-admin` (sqld.yaml).
managedDatabase:
  enabled: true
  adminUrl: http://sqld-admin.edger.svc.cluster.local:9090
  userUrl: http://sqld-data.edger.svc.cluster.local:8080
  adminKeySecret:
    name: sqld-admin
    key: admin-auth-key
  signerKeySecret:
    name: edger-sqld-signer
    key: key
  budgetBytes: "4294967296"
  persistence:
    existingClaim: edger-managed-database

userWorkers:
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

# Recursos da instância multi-app (plano EDG-25): request de 1 Gi e
# limite de 4 Gi de memória; CPU igual à de hoje (Cinzel).
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
