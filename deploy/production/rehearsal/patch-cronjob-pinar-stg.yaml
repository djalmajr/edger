# URL do backup do banco `pinar-stg` no namespace do ensaio.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqld-backup-pinar-stg
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              env:
                - name: SQLD_URL
                  value: http://pinar-stg.edger-ensaio.svc.cluster.local:8080
