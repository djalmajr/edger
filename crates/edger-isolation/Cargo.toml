[package]
name = "edger-isolation"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Deno process and WebAssembly isolation backends for EdgeR"
publish = false

[dependencies]
edger-core = { path = "../edger-core" }
futures-core.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
tempfile = "3"
sha2.workspace = true
# EDG-4 deploy-time pre-compression: same versions already locked by the
# orchestrator (tower-http compression-br / zip), so no new lock entry.
brotli = "9"
flate2 = "1"
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wat = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "process"] }
tempfile = "3"
bytes.workspace = true
serde_json.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wat.workspace = true

[[example]]
name = "embedding-spike-wasm"
path = "examples/embedding-spike-wasm.rs"

[[example]]
name = "embedding-spike-deno"
path = "examples/embedding-spike-deno.rs"

[features]
default = []
# Skeleton backends — no V8/wasmtime engine link in default CI build.
deno = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat"]
# Persistent Deno worker processes over UDS (Epic 15). Enables the tokio
# surface needed for Unix sockets, child processes and async IO.
multiproc = ["tokio/net", "tokio/io-util", "tokio/process", "tokio/rt-multi-thread"]
