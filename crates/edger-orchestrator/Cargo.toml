[package]
name = "edger-orchestrator"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "EdgeR HTTP runtime, control plane, deploy and observability"
publish = false

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[[bin]]
name = "edger"
path = "src/bin/edger.rs"

[dependencies]
edger-core = { path = "../edger-core" }
edger-worker = { path = "../edger-worker" }
edger-isolation = { path = "../edger-isolation", features = ["deno", "wasm", "multiproc"] }
anyhow.workspace = true
async-trait.workspace = true
argon2 = "0.5"
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.4"
# console_auth.rs uses argon2's re-exported rand_core::OsRng, which needs
# rand_core/getrandom; declare it explicitly so it holds in the non-dev graph.
password-hash = { version = "0.5", default-features = false, features = ["getrandom"] }
saffron = "0.1.0"
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-appender-tracing = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "logs", "grpc-tonic", "http-proto", "reqwest-client", "reqwest-rustls"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["experimental_logs_batch_log_processor_with_async_runtime", "experimental_trace_batch_span_processor_with_async_runtime", "logs", "rt-tokio", "trace"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
futures-util = { version = "0.3", default-features = false }
tower-http.workspace = true
http-body = "1"
http.workspace = true
hyper.workspace = true
# Egress guard (EDG-38 S2a): HTTP/1.1 framing on both sides through hyper
# (server over the worker's Unix socket, client over the pinned-IP TLS
# stream) and outbound TLS pinned to the resolved IP with the hostname's SNI.
# `hyper-util` (tokio IO adapter), `http-body-util`, `rustls`, `tokio-rustls`,
# `url` and `webpki-roots` are already in Cargo.lock (transitive via
# axum/reqwest); promoted to direct dependencies.
http-body-util = "0.1"
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Provider-free: the process-level CryptoProvider comes from the graph
# (ring, via reqwest's rustls-tls); enabling a second provider here would
# make rustls's auto-detection panic. The `ring` feature is the SAME provider
# already in the graph (it is rustls's default); making it direct keeps the
# tests able to name `rustls::crypto::ring::RingProvider` explicitly.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
url = "2"
webpki-roots = "1"
jsonwebtoken = "9"
uuid.workspace = true
rusqlite.workspace = true
sha2.workspace = true
# App secrets vault (EDG-38): ChaCha20-Poly1305 at rest, master key and
# decrypted value zeroized in memory (zeroize is already a transitive
# dependency via rustls; promoted to direct here, no new lock entry).
chacha20poly1305.workspace = true
zeroize.workspace = true
semver.workspace = true
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[dev-dependencies]
base64 = "0.22"
# Raw HTTP/1.1 parsing in the egress guard test upstream (EDG-38 S2a); already
# in Cargo.lock (transitive via hyper).
httparse = "1"
# Decoding in the compression tests (EDG-2/EDG-3): the versions are already
# in Cargo.lock (brotli via tower-http compression-br, flate2 via zip/deflate).
brotli = "9"
flate2 = "1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
edger-isolation = { path = "../edger-isolation", features = ["deno", "wasm", "multiproc"] }
rusqlite.workspace = true
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
serde_json.workspace = true
# `test-util` exposes `tokio::time::pause`/`advance` for the paused-clock
# cron reconciliation tests (EDG-26); dev-only, not part of the product graph.
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
futures-util = { version = "0.3", default-features = false }
