[package]
name = "edger-worker"
version.workspace = true
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Worker pools, lifecycle and runtime metrics for EdgeR"
publish = false

[features]
# (EDG-10 rev3) Test seam for the min-processes admission section
# (`AdmissionSectionSeam` in pool.rs): inert unless armed from a test.
# Enabled for this package's own test targets via the self dev-dependency
# below; production builds (default features) compile none of it.
test-hooks = []

[dependencies]
edger-core = { path = "../edger-core" }
edger-isolation = { path = "../edger-isolation" }
futures-core.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
uuid.workspace = true
lru.workspace = true
thiserror.workspace = true
bytes.workspace = true

[dev-dependencies]
edger-worker = { path = ".", features = ["test-hooks"] } # (EDG-10 rev3) self-reference: compile the `test-hooks` seam for this package's integration tests
tokio = { workspace = true, features = ["rt", "macros", "test-util", "time"] }
edger-isolation = { path = "../edger-isolation", features = ["wasm"] }
serde_yaml.workspace = true
tempfile = "3"
wat.workspace = true
