<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="EdgeR">
  <!-- Marca EdgeR: letra E sugerida por tres rotas horizontais com nos nas pontas.
       Cores: primarias quentes do theme.css (workers/ui/src/theme.css):
       light  primary        oklch(0.555 0.163 48.998) = #BB4D00
       dark   sidebar-primary oklch(0.769 0.188 70.08) = #FE9A00 (acento sobre fundo escuro) -->
  <title>EdgeR</title>
  <style>
    .edger-route { fill: none; stroke: #BB4D00; stroke-width: 4; stroke-linecap: round; }
    .edger-node { fill: #BB4D00; }
    @media (prefers-color-scheme: dark) {
      .edger-route { stroke: #FE9A00; }
      .edger-node { fill: #FE9A00; }
    }
  </style>
  <g class="edger-route">
    <path d="M7 8h14" />
    <path d="M7 16h9" />
    <path d="M7 24h14" />
  </g>
  <g class="edger-node">
    <circle cx="24" cy="8" r="3" />
    <circle cx="19" cy="16" r="3" />
    <circle cx="24" cy="24" r="3" />
  </g>
</svg>
