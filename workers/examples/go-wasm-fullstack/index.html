<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go WASM fullstack</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; line-height: 1.5; }
      main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
      header, section { margin-bottom: 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      p { margin: 0.25rem 0; }
      button { font: inherit; padding: 0.5rem 1rem; border-radius: 0.375rem;
        border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
      button[disabled] { cursor: progress; opacity: 0.6; }
      #status { margin-top: 0.75rem; font-weight: 600; }
      #status[data-state="error"] { color: #b00020; }
      #status[data-state="success"] { color: #1b6e2d; }
      pre { overflow: auto; padding: 0.75rem; border: 1px solid GrayText;
        border-radius: 0.375rem; max-height: 24rem; white-space: pre-wrap; word-break: break-word; }
      code { font-family: ui-monospace, monospace; }
      @media (max-width: 30rem) { main { padding: 1rem 0.75rem; } button { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Go WASM fullstack</h1>
        <p>A Vite single-page app served next to a Go (wasip1) backend.</p>
      </header>
      <section aria-labelledby="try-title">
        <h2 id="try-title">Backend call</h2>
        <p>Sends <code>POST api/inspect</code> with an ethical body and an <code>x-example</code> header.</p>
        <button type="button" id="run">Testar API Go</button>
        <p id="status" role="status" aria-live="polite" data-state="idle">Idle: nothing requested yet.</p>
      </section>
      <section aria-labelledby="out-title">
        <h2 id="out-title">Response</h2>
        <pre id="out" tabindex="0" aria-label="Backend response">(no response yet)</pre>
      </section>
    </main>
    <script type="module">
      const button = document.getElementById('run');
      const status = document.getElementById('status');
      const out = document.getElementById('out');

      function setState(state, message) {
        status.dataset.state = state;
        status.textContent = message;
        button.disabled = state === 'loading';
        button.setAttribute('aria-busy', String(state === 'loading'));
      }

      // The URL is resolved against the base the EdgeR injected into
      // index.html (name route, pinned version or vhost): never a fixed
      // root-relative '/api'.
      function inspectUrl() {
        return new URL('api/inspect', document.baseURI);
      }

      async function run() {
        setState('loading', 'Loading: calling the Go backend...');
        out.textContent = '(waiting for the response)';
        try {
          const response = await fetch(inspectUrl(), {
            method: 'POST',
            headers: { 'content-type': 'text/plain', 'x-example': 'go-wasm-fullstack' },
            body: 'hello from the example SPA',
          });
          const text = await response.text();
          let shown = text;
          try {
            shown = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            // not JSON: show the raw text as is
          }
          out.textContent = shown;
          if (!response.ok) {
            setState('error', `Error: the backend answered HTTP ${response.status}.`);
            return;
          }
          setState('success', `Success: HTTP ${response.status} from ${inspectUrl().pathname}.`);
        } catch {
          out.textContent = '(request failed)';
          setState('error', 'Error: the request could not be completed.');
        }
      }

      button.addEventListener('click', run);
    </script>
  </body>
</html>
