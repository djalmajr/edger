spec:
  inputs:
    environment:
      description: "Ambiente de deploy — o único alvo disponível é labdev e o deploy é manual."
      options:
        - labdev
      default: labdev

---
# Este repositório é hospedado no GitHub. Esta pipeline só passa a executar
# depois que o projeto for importado ou espelhado em gitlab.cithyper.click.
# Push/MR da main apenas validam; imagem só é publicada em tag SemVer ou em
# pipeline iniciada via web/API. O deploy do labdev é sempre manual.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never

stages:
  - test
  - build
  - deploy

.gates: &gates
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

test:
  stage: test
  <<: *gates
  image: rust:1.88-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-ci"
    CARGO_TERM_COLOR: always
    DENO_INSTALL: "$CI_PROJECT_DIR/.deno-ci"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-ci/registry/index
      - .cargo-ci/registry/cache
      - .cargo-ci/git/db
      - .deno-ci
      - target
  script:
    # Um único job mantém o gate enxuto sem baixar e compilar as dependências
    # duas vezes em runners distintos. Deno é dependência de RUNTIME dos
    # testes (o backend multiproc executa processos Deno de verdade) — sem
    # ele o gate passaria em silêncio pulando exatamente o que importa.
    - |
      rustup component add rustfmt clippy
      if [ ! -x "$DENO_INSTALL/bin/deno" ]; then
        curl -fsSL https://deno.land/install.sh | sh -s -- -y
      fi
      export PATH="$DENO_INSTALL/bin:$PATH"
      deno --version
    - cargo fmt -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked

# O chart é parte do contrato de deploy: lint + render do labdev + as
# validações NEGATIVAS (réplicas>1 e HPA precisam FALHAR o render enquanto
# não houver distribuição de workers) — regressão aqui já quebrou upgrade.
helm:
  stage: test
  <<: *gates
  image:
    name: alpine/k8s:1.31.13@sha256:8bbc91da39ec2d230bbee9b17aa379ca5f33084f69659f7185adcdf971e6f596
    entrypoint: [""]
  before_script: []
  cache: {}
  script:
    - helm lint charts/edger -f charts/edger/values-labdev.yaml
    - helm template edger charts/edger -f charts/edger/values-labdev.yaml > /tmp/labdev.yaml
    - grep -A1 "strategy:" /tmp/labdev.yaml | grep -q "type: Recreate"
    - |
      if helm template edger charts/edger -f charts/edger/values-labdev.yaml --set replicaCount=2 > /dev/null 2>&1; then
        echo "replicaCount=2 deveria falhar o render (PVC RWO + índice em memória)" >&2; exit 1
      fi
    - |
      if helm template edger charts/edger -f charts/edger/values-labdev.yaml --set hpa.enabled=true > /dev/null 2>&1; then
        echo "hpa.enabled deveria falhar o render" >&2; exit 1
      fi

# O AGENTS deste repo exige o gate ágil de planning/refinement para mudança
# de estado - o mesmo que o workflow do GitHub roda. Sem ele, uma pipeline
# via API publicaria imagem de um commit que reprova o planning.
project-gates:
  stage: test
  <<: *gates
  image: rust:1.88-bookworm
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-ci"
    BUN_INSTALL: "$CI_PROJECT_DIR/.bun-ci"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-ci/registry/index
      - .cargo-ci/registry/cache
      - .cargo-ci/git/db
      - .bun-ci
      - target
  script:
    - |
      # python3 e unzip EXPLÍCITOS: rust:bookworm não garante python3, e o
      # installer do bun exige unzip - confiar no herdado quebraria só no CI.
      apt-get update -qq && apt-get install -qq -y ripgrep zip unzip python3 >/dev/null
      if [ ! -x "$BUN_INSTALL/bin/bun" ]; then
        curl -fsSL https://bun.sh/install | bash >/dev/null
      fi
      export PATH="$BUN_INSTALL/bin:$PATH"
      bun --version
    - cd workers && bun install --frozen-lockfile && cd ..
    - |
      scratch="$CI_PROJECT_DIR/.planning-gates"
      mkdir -p "$scratch"
      set +e
      python3 planning/edger/scripts/refinement-lint.py \
        --scope planning/edger \
        --round gitlab-ci >"$scratch/refinement-report.txt"
      refinement_status=$?
      set -e
      cat "$scratch/refinement-report.txt"
      test "$refinement_status" -eq 0
      SCRATCH="$scratch" planning/edger/scripts/run-gates.sh

# Mesma catraca do Studio: o que já entrou fica; só ADIÇÃO de segredo conta.
secrets:
  stage: test
  <<: *gates
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  before_script: []
  cache: {}
  variables:
    # `gitleaks git` percorre o range de verdade: com clone raso o commit-base
    # do MR não existe localmente e o range sairia vazio - passaria calado.
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        RANGE="$CI_COMMIT_SHA~1..$CI_COMMIT_SHA"
      fi
      echo "varrendo $RANGE"
      gitleaks git --log-opts="$RANGE" --redact --no-banner .

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  environment:
    name: release-build
    action: prepare
  needs:
    - job: test
    - job: helm
    - job: project-gates
    - job: secrets
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - when: never
  before_script: []
  cache: {}
  script:
    - |
      [ "${HARBOR_REGISTRY:-}" = "repositorio.cithyper.click" ] || {
        echo "HARBOR_REGISTRY deve ser repositorio.cithyper.click" >&2; exit 1; }
      [ "${HARBOR_PROJECT:-}" = "centralit" ] || {
        echo "HARBOR_PROJECT deve ser centralit" >&2; exit 1; }
      [ -n "${HARBOR_USER:-}" ] || { echo "HARBOR_USER ausente" >&2; exit 1; }
      [ -n "${HARBOR_PASSWORD:-}" ] || {
        echo "HARBOR_PASSWORD ausente" >&2; exit 1; }
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$HARBOR_REGISTRY" \
        "$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        dest_tag="$CI_COMMIT_TAG"
      else
        dest_tag="$CI_COMMIT_SHORT_SHA"
      fi

      set -- \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$HARBOR_REGISTRY/$HARBOR_PROJECT/edger:$dest_tag" \
        --digest-file "$CI_PROJECT_DIR/edger.digest" \
        --image-name-with-digest-file "$CI_PROJECT_DIR/edger.image-ref" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.version=$dest_tag"

      # `latest` só acompanha release final; pré-release e SHA nunca o movem.
      if printf '%s\n' "${CI_COMMIT_TAG:-}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
        set -- "$@" --destination "$HARBOR_REGISTRY/$HARBOR_PROJECT/edger:latest"
      fi

      /kaniko/executor "$@"
  artifacts:
    expire_in: never
    paths:
      - edger.digest
      - edger.image-ref

.deploy:
  stage: deploy
  image:
    # helm e kubectl já vêm na imagem; o runner do labdev não precisa baixar
    # binários durante o job.
    name: alpine/k8s:1.31.13@sha256:8bbc91da39ec2d230bbee9b17aa379ca5f33084f69659f7185adcdf971e6f596
    entrypoint: [""]
  needs:
    - job: build-image
      artifacts: true
  interruptible: false
  allow_failure: false
  before_script: []
  script:
    - |
      set -eu
      [ -n "${KUBECONFIG_FILE:-}" ] && [ -s "$KUBECONFIG_FILE" ] || {
        echo "KUBECONFIG_LABDEV ausente (variável File compartilhada)" >&2
        exit 1
      }
      [ "$K8S_NAMESPACE" = "hyper" ] || {
        echo "K8S_NAMESPACE deve ser hyper" >&2
        exit 1
      }
      [ "${HARBOR_REGISTRY:-}" = "repositorio.cithyper.click" ] || {
        echo "HARBOR_REGISTRY deve ser repositorio.cithyper.click" >&2
        exit 1
      }
      [ "${HARBOR_PROJECT:-}" = "centralit" ] || {
        echo "HARBOR_PROJECT deve ser centralit" >&2
        exit 1
      }

      umask 077
      export KUBECONFIG=/tmp/edger-kubeconfig
      cp "$KUBECONFIG_FILE" "$KUBECONFIG"
      chmod 600 "$KUBECONFIG"
    - |
      set -eu
      digest_file="$CI_PROJECT_DIR/edger.digest"
      [ -f "$digest_file" ] || { echo "edger.digest ausente" >&2; exit 1; }
      image_digest=$(tr -d '[:space:]' < "$digest_file")
      case "$image_digest" in
        sha256:?*) ;;
        *) echo "digest inválido em edger.digest" >&2; exit 1 ;;
      esac
      image_repository="$HARBOR_REGISTRY/$HARBOR_PROJECT/edger"

      helm upgrade --install edger charts/edger \
        --namespace "$K8S_NAMESPACE" \
        -f "$EDGER_VALUES" \
        --set-string image.repository="$image_repository" \
        --set-string image.digest="$image_digest" \
        --history-max 5
    - |
      # Espera GET-only: a ServiceAccount compartilhada não precisa de watch.
      set -eu
      deployment=edger
      timeout=300
      poll=3
      deadline=$(($(date +%s) + timeout))

      report_failure() {
        echo "--- evidência deployment/$deployment ---" >&2
        kubectl -n "$K8S_NAMESPACE" get "deployment/$deployment" \
          -o jsonpath='generation={.metadata.generation} observed={.status.observedGeneration} spec={.spec.replicas} status={.status.replicas} updated={.status.updatedReplicas} ready={.status.readyReplicas} available={.status.availableReplicas} unavailable={.status.unavailableReplicas}{"\n"}' \
          --request-timeout=15s >&2 || true
        kubectl -n "$K8S_NAMESPACE" get pods \
          --selector=app.kubernetes.io/instance=edger \
          -o jsonpath='{range .items[*]}{.metadata.name}{" phase="}{.status.phase}{" ready="}{.status.containerStatuses[0].ready}{" restarts="}{.status.containerStatuses[0].restartCount}{" state="}{.status.containerStatuses[0].state}{"\n"}{end}' \
          --request-timeout=15s >&2 || true
        echo "--- fim da evidência ---" >&2
      }

      while :; do
        remaining=$((deadline - $(date +%s)))
        if [ "$remaining" -le 0 ]; then
          echo "timeout esperando deployment/$deployment" >&2
          report_failure
          exit 1
        fi

        state="$(
          kubectl -n "$K8S_NAMESPACE" get "deployment/$deployment" \
            -o jsonpath='{.metadata.generation}{"|"}{.status.observedGeneration}{"|"}{.spec.replicas}{"|"}{.status.replicas}{"|"}{.status.updatedReplicas}{"|"}{.status.availableReplicas}{"|"}{.status.readyReplicas}{"|"}{.status.unavailableReplicas}' \
            --request-timeout="${remaining}s"
        )" || {
          echo "falha ao consultar deployment/$deployment" >&2
          report_failure
          exit 1
        }

        IFS='|' read -r generation observed desired reported updated available ready unavailable <<EOF
      $state
      EOF
        observed=${observed:-0}
        desired=${desired:-0}
        reported=${reported:-0}
        updated=${updated:-0}
        available=${available:-0}
        ready=${ready:-0}
        unavailable=${unavailable:-0}

        case "$generation:$observed:$desired:$reported:$updated:$available:$ready:$unavailable" in
          *[!0-9:]* | :*)
            echo "snapshot de readiness inválido para deployment/$deployment" >&2
            report_failure
            exit 1
            ;;
        esac

        if [ "$observed" -ge "$generation" ] &&
          [ "$reported" -eq "$desired" ] &&
          [ "$updated" -eq "$desired" ] &&
          [ "$available" -eq "$desired" ] &&
          [ "$ready" -eq "$desired" ] &&
          [ "$unavailable" -eq 0 ]; then
          echo "deployment/$deployment pronto ($ready/$desired)"
          break
        fi

        sleep "$poll"
      done

deploy:labdev:
  extends: .deploy
  resource_group: edger-labdev
  environment:
    name: labdev
    url: https://edger-labdev.cloud4biz.com
  variables:
    KUBECONFIG_FILE: "$KUBECONFIG_LABDEV"
    K8S_NAMESPACE: hyper
    EDGER_VALUES: charts/edger/values-labdev.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$/'
      when: manual
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
      when: manual
    - when: never
