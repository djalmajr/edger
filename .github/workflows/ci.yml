name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy,rustfmt
      - uses: denoland/setup-deno@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt -- --check

  otel:
    name: Optional OTLP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: denoland/setup-deno@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p edger-orchestrator --features otel

  project-gates:
    name: cPanel and planning contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install planning gate tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Install core frontend dependencies
        working-directory: workers
        run: bun install --frozen-lockfile
      - run: planning/edger/scripts/cpanel-ui-gate.sh
      - name: Run planning gates
        shell: bash
        run: |
          scratch="${RUNNER_TEMP}/edger-planning-gates"
          mkdir -p "$scratch"
          set +e
          python3 planning/edger/scripts/refinement-lint.py \
            --scope planning/edger \
            --round github-ci >"$scratch/refinement-report.txt"
          refinement_status=$?
          set -e
          cat "$scratch/refinement-report.txt"
          test "$refinement_status" -eq 0
          SCRATCH="$scratch" planning/edger/scripts/run-gates.sh

  helm:
    name: Helm and Rancher assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/edger --set-string rootKey.value=ci-test-root-key
      - run: >-
          helm template edger charts/edger
          --set-string rootKey.value=ci-test-root-key
          >/tmp/edger-default.yaml
      - name: Render optional OTLP and existing Secret
        run: >-
          helm template edger charts/edger
          --set otel.enabled=true
          --set otel.endpoint=http://otel-collector:4318
          --set rootKey.source=existing
          --set rootKey.existingSecret=edger-root-key
          >/tmp/edger-otel.yaml

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: edger:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=O'Saasy-1.0

  # Publica a imagem no ghcr em tag SemVer — o labdev puxa ghcr.io direto
  # (sem mirror/kaniko): o deploy referencia o DIGEST impresso por este job.
  # `latest` só acompanha release final; pré-release nunca o move.
  publish:
    name: Publish container image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [rust, otel, project-gates, helm, image, secrets, dependencies]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest apenas em vX.Y.Z final (flavor latest=false + regra explícita).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=O'Saasy-1.0
      - name: Digest para o deploy
        run: |
          echo "imagem: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          echo "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses
