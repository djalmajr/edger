name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy,rustfmt
      - uses: denoland/setup-deno@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt -- --check

  otel:
    name: Optional OTLP integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: denoland/setup-deno@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p edger-orchestrator --features otel

  project-gates:
    name: cPanel and planning contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install planning gate tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Install core frontend dependencies
        working-directory: workers
        run: bun install --frozen-lockfile
      - run: planning/edger/scripts/cpanel-ui-gate.sh
      - name: Run planning gates
        shell: bash
        run: |
          scratch="${RUNNER_TEMP}/edger-planning-gates"
          mkdir -p "$scratch"
          set +e
          python3 planning/edger/scripts/refinement-lint.py \
            --scope planning/edger \
            --round github-ci >"$scratch/refinement-report.txt"
          refinement_status=$?
          set -e
          cat "$scratch/refinement-report.txt"
          test "$refinement_status" -eq 0
          SCRATCH="$scratch" planning/edger/scripts/run-gates.sh

  helm:
    name: Helm and Rancher assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/edger --set-string rootKey.value=ci-test-root-key
      - run: >-
          helm template edger charts/edger
          --set-string rootKey.value=ci-test-root-key
          >/tmp/edger-default.yaml
      - name: Render optional OTLP and existing Secret
        run: >-
          helm template edger charts/edger
          --set otel.enabled=true
          --set otel.endpoint=http://otel-collector:4318
          --set rootKey.source=existing
          --set rootKey.existingSecret=edger-root-key
          >/tmp/edger-otel.yaml
      - name: Render com valores em texto (formulário do Rancher)
        run: >-
          helm template edger charts/edger
          --set rootKey.existingSecret=edger-root-key
          --set ingress.enabled=true
          --set-string ingress.host='*.example.com'
          --set-string ingress.pathType=ImplementationSpecific
          --set-string 'ingress.annotations=konghq.com/strip-path: "true"'
          --set-string 'extraEnv=[]'
          >/tmp/edger-rancher-form.yaml

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: edger:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=O'Saasy-1.0

  # Publica a imagem no ghcr em tag SemVer e, em seguida, o chart como OCI em
  # oci://ghcr.io/<owner>/charts/edger com o digest dessa imagem gravado em
  # image.digest — o labdev instala o chart do ghcr e roda exatamente a imagem
  # daquele release, sem digest passado à mão. `latest` só acompanha release
  # final; pré-release nunca o move.
  publish:
    name: Publish container image and Helm chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [rust, otel, project-gates, helm, image, secrets, dependencies]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Antes de publicar qualquer coisa: chart e tag contam a mesma versão.
      - name: Versões (Chart.yaml e core workers) batem com a tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '$1 == "version:" {print $2}' charts/edger/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/edger/Chart.yaml)"
          if [ "$chart_version" != "$tag_version" ] || [ "$app_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml (version=$chart_version, appVersion=$app_version) não bate com a tag $GITHUB_REF_NAME"
            exit 1
          fi
          for manifest in workers/core/*/manifest.yaml; do
            [ -f "$manifest" ] || continue
            worker_version="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2}' "$manifest")"
            if [ "$worker_version" != "$tag_version" ]; then
              echo "::error::$manifest (version=$worker_version) não bate com a tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest apenas em vX.Y.Z final (flavor latest=false + regra explícita).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=O'Saasy-1.0
      # Helm fixado em v3.18.6: versões maiores quebram o passo de Tag no ghcr
      # ao publicar o chart (helm/helm#31223).
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6
      - name: Publica o chart no ghcr (OCI) fixado no digest da imagem
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          # Digest vazio passaria pelo grep abaixo (a linha original já casa)
          # e publicaria um chart preso à tag mutável.
          case "$IMAGE_DIGEST" in
            sha256:?*) ;;
            *) echo "::error::digest da imagem vazio ou inválido: '$IMAGE_DIGEST'"; exit 1 ;;
          esac
          sed -i -E "s|^  digest: \"\"$|  digest: \"${IMAGE_DIGEST}\"|" charts/edger/values.yaml
          grep -qx "  digest: \"${IMAGE_DIGEST}\"" charts/edger/values.yaml
          helm lint charts/edger --set-string rootKey.value=ci-test-root-key
          helm package charts/edger --destination "$RUNNER_TEMP/chart"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          # O ghcr pode demorar a propagar blobs recém-escritos; tenta 3x.
          for attempt in 1 2 3; do
            if helm push "$RUNNER_TEMP/chart/edger-${GITHUB_REF_NAME#v}.tgz" "$CHART_REPO"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::helm push falhou 3 vezes"
              exit 1
            fi
            echo "helm push falhou (tentativa $attempt); nova tentativa em 10s"
            sleep 10
          done
      - name: Referências para o deploy
        run: |
          echo "imagem: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
          echo "chart: oci://ghcr.io/${{ github.repository_owner }}/charts/edger --version ${GITHUB_REF_NAME#v}"
          {
            echo "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
            echo
            echo "oci://ghcr.io/${{ github.repository_owner }}/charts/edger --version ${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories licenses
