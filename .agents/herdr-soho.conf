lanes=off
max_workers=4
multi_role=on
reuse_workers=on
role.implementer.kind=pi
role.implementer.model=lbvllm/qwen3.8-27b
role.implementer.effort=high
# Designer sobe servidor e roda o navegador: cursor com grok (recomendação
# da sessão skills, D37).
role.designer.kind=cursor
role.designer.model=grok-4.7
role.designer.effort=high
role.tasker.kind=pi
role.tasker.model=lbvllm/qwen3.8-27b
role.tasker.effort=high
role.scouter.kind=pi
role.scouter.model=lbvllm/qwen3.8-27b
role.scouter.effort=high
role.researcher.kind=pi
role.researcher.model=lbvllm/qwen3.8-27b
role.researcher.effort=high
# Revisores no CLI do grok (família xai, diferente dos implementadores
# qwen/alibaba), a pedido do operador em 2026-10-07: revisão comum em medium,
# security-reviewer em high. No CLI do grok o effort é separado do modelo.
role.reviewer.kind=grok
role.reviewer.model=grok-4.7
role.reviewer.effort=medium
role.security-reviewer.kind=grok
role.security-reviewer.model=grok-4.7
role.security-reviewer.effort=high
# UI e tela fora do codex, que não tem porta para o navegador (D37).
role.ui-reviewer.kind=claude
role.ui-reviewer.model=opus
role.ui-reviewer.effort=high
role.inspector.kind=claude
role.inspector.model=opus
role.inspector.effort=high
role.documenter.kind=pi
role.documenter.model=lbvllm/qwen3.8-27b
role.documenter.effort=high
# Rede no sandbox do codex, para o revisor conferir fatos externos (gh api).
# É flag do codex, então vai em args.codex: em role.<papel>.args ela era
# anexada a qualquer kind, e para o claude `-c` é --continue, que retomou a
# sessão do orquestrador (2026-09-25). Hoje nenhum papel é codex; vale para um
# spawn com --kind codex.
args.codex=-c sandbox_workspace_write.network_access=true
split_max_panes=5
split_min_pane=0.1
