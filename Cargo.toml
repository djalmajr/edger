[workspace]
resolver = "2"
members = [
  "crates/edger-core",
  "crates/edger-worker",
  "crates/edger-isolation",
  "crates/edger-orchestrator",
  "crates/edger-mcp",
]

[workspace.package]
version = "0.3.2-rc.24"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/djalmajr/edger"
rust-version = "1.99"
homepage = "https://github.com/djalmajr/edger"
documentation = "https://github.com/djalmajr/edger/tree/main/docs"

[workspace.dependencies]
# dependências comuns (ex: hyper, tokio, etc. serão adicionadas conforme necessário)
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3.0"
tracing = "0.1"
bytes = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures-core = "0.3"
thiserror = "2"
postcard = "1"
lru = "0.18.2"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-br", "compression-gzip"] }
http = "1"
hyper = { version = "1", features = ["full"] }
semver = "1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
libsql = { version = "0.10.0-pre.4", default-features = false, features = ["core", "remote", "sync", "tls"] }
sha2 = "0.10"
# App secrets vault (EDG-38): ChaCha20-Poly1305 at rest + zeroize for the
# master key and the decrypted value. Both already permitted by deny.toml
# (Apache-2.0 OR MIT); zeroize is a transitive dep (rustls) promoted to
# direct so no new lock entry is forced for it. The `zeroize` feature makes
# the cipher zeroize its internal key copy on drop (F4).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"
wasmtime = { version = "49.0.2", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p1"] }
wat = "1.261"
